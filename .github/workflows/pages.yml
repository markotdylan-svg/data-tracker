name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily run"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # after a daily run, deploy the commit it just pushed
      - name: Assemble the site with the two data files
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          for f in history.csv status.json; do
            if [ -f "data/$f" ]; then cp "data/$f" _site/data/; fi
          done
          ls -la _site _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Deploying in its own job, after the upload has finished, gives GitHub time to
  # register the artifact. The deploy is tried up to three times because GitHub
  # sometimes fails to find a just-uploaded artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d3.outputs.page_url || steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 60
      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
